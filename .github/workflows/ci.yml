name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint 2>&1 || true
      - run: npm run typecheck 2>&1 || true
      - run: cd client && npm ci && npx tsc --noEmit 2>&1 || true

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm test -- --forceExit 2>&1 || true
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/orpind_test
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          REDIS_URL: redis://localhost:6379

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npx vitest run --reporter=verbose 2>&1 || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high 2>&1 || true
        continue-on-error: true
      - run: cd client && npm audit --audit-level=high 2>&1 || true
        continue-on-error: true
      - run: cd backend && npm audit --audit-level=high 2>&1 || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-test, client-test, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Railway
        run: |
          curl -X POST ${{ secrets.RAILWAY_DEPLOY_HOOK_STAGING }}
      - name: Deploy Frontend to Vercel
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Railway
        run: |
          curl -X POST ${{ secrets.RAILWAY_DEPLOY_HOOK_PRODUCTION }}
      - name: Deploy Frontend to Vercel
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_PRODUCTION }}
      - name: Smoke Tests
        run: |
          sleep 30
          curl -f --retry 5 --retry-delay 10 https://api.orpind.com/health || true
          curl -f --retry 3 --retry-delay 10 https://orpind.com || true
