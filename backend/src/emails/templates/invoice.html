<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice {{invoiceNumber}}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; color: #2d2a26; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 3px solid #b8860b; }
    .brand h1 { font-size: 32px; color: #b8860b; margin: 0; letter-spacing: 3px; font-weight: 700; }
    .brand p { font-size: 11px; color: #8a8580; margin: 5px 0 0; letter-spacing: 2px; text-transform: uppercase; }
    .invoice-info { text-align: right; }
    .invoice-info h2 { font-size: 24px; color: #2d2a26; margin: 0 0 5px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    .invoice-info p { font-size: 13px; color: #5a5550; margin: 2px 0; }
    .invoice-details { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .detail-block h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #b8860b; margin: 0 0 8px; }
    .detail-block p { font-size: 13px; color: #5a5550; margin: 2px 0; line-height: 1.5; }
    .amount-due { background: #f0ebe3; border-radius: 6px; padding: 20px; text-align: right; margin-bottom: 30px; }
    .amount-due .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8a8580; }
    .amount-due .amount { font-size: 32px; font-weight: 700; color: #b8860b; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    thead th { background: #2d2a26; color: #ffffff; padding: 12px 15px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    thead th:last-child { text-align: right; }
    tbody td { padding: 12px 15px; border-bottom: 1px solid #f0ebe3; font-size: 13px; color: #2d2a26; }
    tbody td:last-child { text-align: right; font-weight: 600; }
    tbody tr:nth-child(even) { background: #faf7f2; }
    .totals { display: flex; justify-content: flex-end; margin-bottom: 40px; }
    .totals-table { width: 280px; }
    .totals-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: #5a5550; }
    .totals-row.grand { border-top: 2px solid #b8860b; margin-top: 8px; padding-top: 12px; font-size: 18px; font-weight: 700; color: #2d2a26; }
    .notes { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e8e2d9; }
    .notes h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #b8860b; margin: 0 0 8px; }
    .notes p { font-size: 12px; color: #8a8580; margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <h1>ORPIND</h1>
        <p>Fine Organic Spices</p>
      </div>
      <div class="invoice-info">
        <h2>Invoice</h2>
        <p><strong>Invoice #:</strong> {{invoiceNumber}}</p>
        <p><strong>Order #:</strong> {{orderNumber}}</p>
        <p><strong>Date:</strong> {{invoiceDate}}</p>
      </div>
    </div>
    <div class="amount-due">
      <div class="label">Total Amount</div>
      <div class="amount">{{total}}</div>
    </div>
    <div class="notes">
      <h4>Terms</h4>
      <p>This is a system-generated invoice. For any queries regarding this invoice, please contact support@orpind.com</p>
    </div>
  </div>
</body>
</html>
